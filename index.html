<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>KAZE MORALES WEB</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --card-bg: rgba(10, 25, 10, 0.85); --fg: #fff; --sub: #88aa88; --border: rgba(0, 255, 0, 0.2); --accent: #00ff00; --accent-glow: rgba(0, 255, 0, 0.5); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: var(--fg); font-family: 'Outfit', sans-serif; padding: 0 0 100px; margin: auto; min-height: 100vh; overflow-x: hidden; max-width: 1200px; }
        
        /* MATRIX RAIN */
        #matrix-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.15; pointer-events: none; }

        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(5, 20, 5, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 999; border-bottom: 1px solid var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
        .logo { font-size: 20px; font-weight: 800; font-style: italic; display: flex; align-items: center; gap: 6px; color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        .menu-btn { background: transparent; border: none; color: var(--accent); font-size: 20px; cursor: pointer; z-index: 1000; }
        
        .banner { width: 100%; height: 180px; position: relative; border-bottom: 1px solid var(--accent); overflow: hidden; }
        .banner video { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; filter: sepia(1) hue-rotate(60deg) saturate(3); }
        .banner-text { position: absolute; bottom: 12px; left: 16px; font-size: 24px; font-weight: 800; font-style: italic; color: var(--accent); }
        .banner-text span { display: block; font-size: 10px; font-style: normal; color: #fff; letter-spacing: 2px; }

        .profile-card { margin: -20px 16px 16px; position: relative; z-index: 10; background: #0a1a0a; border: 1px solid var(--accent); border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; box-shadow: 0 0 15px var(--accent-glow); }
        .profile-avatar { width: 45px; height: 45px; border-radius: 50%; background: rgba(0,255,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--accent); border: 1px solid var(--accent); }
        .profile-info { flex: 1; }
        .profile-info .stats { display: flex; gap: 8px; font-size: 10px; color: var(--sub); margin-bottom: 4px; }
        .role-badge { background: rgba(255,255,255,0.1); color: #ccc; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 600; border: 1px solid #555; }

        .tabs-container { padding: 0 16px 16px; overflow-x: auto; display: flex; gap: 8px; scrollbar-width: none; }
        .tab { background: transparent; border: 1px solid var(--border); border-radius: 99px; padding: 8px 16px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--sub); cursor: pointer; }
        .tab.active { background: var(--accent); color: #000; border-color: transparent; font-weight: 800; }

        .section-title { padding: 0 16px; margin-bottom: 12px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 5px; margin-top: 20px; text-shadow: 0 0 5px var(--accent); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding: 0 16px; margin-bottom: 20px; }
        .card { background: var(--card-bg); border-radius: 16px; padding: 16px 10px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px); border: 1px solid var(--border); overflow: hidden; }
        .card:hover { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-2px); }
        .card i.main-icon { font-size: 26px; color: var(--accent); margin-bottom: 10px; }
        .card h3 { font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #fff; }
        .card p { font-size: 9px; color: var(--sub); margin-bottom: 10px; }
        .tag { font-size: 8px; font-weight: 800; background: rgba(0,255,0,0.1); color: var(--accent); padding: 3px 8px; border-radius: 6px; }

        .lock-icon { position: absolute; top: 10px; right: 10px; font-size: 16px; color: #ffb800; text-shadow: 0 0 5px #000; display: none; }
        .is-locked .lock-icon { display: block; }
        .is-locked { filter: grayscale(0.8); opacity: 0.6; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 99999; padding: 20px; }
        .modal-content { background: #0a1a0a; border: 1px solid var(--accent); border-radius: 20px; padding: 24px; max-width: 400px; width: 100%; position: relative; box-shadow: 0 0 30px var(--accent-glow); }
        .modal-close { position: absolute; top: 16px; right: 16px; font-size: 20px; color: var(--sub); cursor: pointer; }
        .modal-content h2 { font-size: 18px; margin-bottom: 16px; color: var(--accent); }
        .modal-content input { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 10px; padding: 12px; color: #fff; margin-bottom: 12px; outline: none; }
        .modal-content button { background: var(--accent); border: none; color: #000; padding: 12px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; margin-bottom: 8px; }

        .side-menu { position: fixed; top: 0; right: -100%; width: 80%; max-width: 300px; height: 100%; background: #0a1a0a; border-left: 1px solid var(--accent); z-index: 999999; transition: 0.3s; padding: 24px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        .side-menu.open { right: 0; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: rgba(0,255,0,0.05); border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: #fff; }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div id="vip-restrict" class="modal-overlay">
        <div class="modal-content" style="text-align:center;">
            <i class="fa-solid fa-lock" style="font-size: 40px; color: #ffb800; margin-bottom: 15px;"></i>
            <h2 style="color: #ffb800;">Fitur Terkunci</h2>
            <p style="font-size: 13px; color: #ccc; margin-bottom: 20px;">Khusus VIP/VVIP. Hubungi Admin.</p>
            <a href="https://wa.me/6285833277934" target="_blank" style="display: block; background: #25D366; color: #fff; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: bold; margin-bottom: 10px;">Hubungi Admin</a>
            <button onclick="document.getElementById('vip-restrict').style.display='none'" style="background: transparent; border: 1px solid #444; color: #888;">TUTUP</button>
        </div>
    </div>

    <div class="top-nav">
        <div class="logo"><i class="fa-solid fa-bolt"></i> KAZE</div>
        <button class="menu-btn" onclick="document.getElementById('side-menu').classList.add('open')"><i class="fa-solid fa-bars"></i></button>
    </div>

    <div class="banner">
        <video autoplay loop muted playsinline><source src="banner.mp4" type="video/mp4"></video>
        <div class="banner-text">MORALES TOOLS<span>BY KAZE</span></div>
    </div>

    <div class="profile-card" onclick="document.getElementById('login-modal').style.display='flex'">
        <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
        <div class="profile-info">
            <div class="stats"><span><i class="fa-solid fa-globe"></i> Publik</span><span id="user-status">Guest (Klik Login)</span></div>
            <div id="user-tier"><span class="role-badge">Role: Guest</span></div>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tab active" onclick="setCat('all', this)">Semua</div>
        <div class="tab" onclick="setCat('basic', this)">Basic</div>
        <div class="tab" onclick="setCat('vip', this)">VIP</div>
        <div class="tab" onclick="setCat('vvip', this)">VVIP</div>
        <div class="tab" onclick="setCat('game', this)">Game</div>
    </div>

    <!-- AREA 1000 FITUR -->
    <div id="features-container"></div>

    <div class="side-menu" id="side-menu">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="font-size: 16px; color: var(--accent);">Menu Info</h2>
            <i class="fa-solid fa-xmark" style="font-size:20px; cursor:pointer; color:var(--sub);" onclick="document.getElementById('side-menu').classList.remove('open')"></i>
        </div>
        <div style="font-size: 12px; font-weight: bold; color: var(--accent);">Support</div>
        <a href="https://whatsapp.com/channel/0029Vb93P22IXnm00tpAg43J" target="_blank" class="menu-item">
            <i class="fa-brands fa-whatsapp" style="color:#25D366;"></i>
            <div><h4>Join Saluran</h4></div>
        </a>
        <a href="https://wa.me/6285833277934" target="_blank" class="menu-item">
            <i class="fa-solid fa-bug" style="color:#ff3333;"></i>
            <div><h4>Lapor Bug</h4></div>
        </a>
    </div>

    <div id="login-modal" class="modal-overlay">
        <div class="modal-content" style="text-align: center;">
            <h2><i class="fa-solid fa-lock"></i> Sign In</h2>
            <input id="login-user" placeholder="Username" style="text-align: center;">
            <input id="login-pass" type="password" placeholder="Password" style="text-align: center;">
            <button onclick="doLogin()">MASUK</button>
            <button onclick="document.getElementById('login-modal').style.display='none'" style="background: transparent; border: 1px solid #444; color: #888;">TUTUP</button>
        </div>
    </div>

    <div class="modal-overlay" id="tool-modal">
        <div class="modal-content" id="tool-content"></div>
    </div>

    <script>
        // --- 1. MATRIX BACKGROUND ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for(let x = 0; x < columns; x++) drops[x] = 1;
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00FF41";
            ctx.font = fontSize + "px monospace";
            for(let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // --- 2. GENERATE 1000 FITUR ---
        const categories = {
            basic: { title: "Basic Tools", icon: "fa-shapes", tag: "BASIC", color: "#00ff00" },
            vip: { title: "VIP Tools", icon: "fa-crown", tag: "VIP", color: "#ffb800" },
            vvip: { title: "VVIP Tools", icon: "fa-syringe", tag: "VVIP", color: "#ff0055" },
            game: { title: "Game Tools", icon: "fa-gamepad", tag: "GAME", color: "#00ff00" }
        };

        const icons = ["fa-youtube", "fa-tiktok", "fa-instagram", "fa-facebook", "fa-hashtag", "fa-code", "fa-qrcode", "fa-calculator", "fa-font", "fa-rotate-left", "fa-wand-magic-sparkles", "fa-camera", "fa-compress", "fa-file-pdf", "fa-robot", "fa-globe", "fa-user-secret", "fa-bug", "fa-crosshairs", "fa-wallet", "fa-phone", "fa-comment-sms", "fa-apple", "fa-telegram", "fa-google", "fa-discord", "fa-building-columns", "fa-money-bill", "fa-film", "fa-brands fa-spotify", "fa-steam", "fa-bitcoin"];
        
        let html = '';
        
        // Loop untuk bikin 1000 fitur (250 per kategori)
        Object.keys(categories).forEach(catKey => {
            const cat = categories[catKey];
            html += `<div class="section-title" data-cat="${catKey}" style="color:${cat.color}; border-color:${cat.color}40;"><i class="fa-solid ${cat.icon}"></i> ${cat.title} (250+)</div>`;
            html += `<div class="grid">`;
            
            for (let i = 1; i <= 250; i++) {
                const icon = icons[Math.floor(Math.random() * icons.length)];
                const isLocked = catKey !== 'basic' ? 'vip-lock' : '';
                html += `
                <div class="card ${isLocked}" data-cat="${catKey}" onclick="openTool('${catKey}-${i}')">
                    <i class="fa-solid fa-lock lock-icon"></i>
                    <i class="fa-brands ${icon} main-icon" style="color:${cat.color};"></i>
                    <h3>${cat.tag} Tool ${i}</h3>
                    <p>Fitur otomatis</p>
                    <span class="tag" style="color:${cat.color}; border:1px solid ${cat.color};">${cat.tag}</span>
                </div>`;
            }
            html += `</div>`;
        });
        document.getElementById('features-container').innerHTML = html;

        // --- 3. LOGIC UI ---
        let userTier = 'GUEST';
        function setCat(cat, el) {
            document.querySelectorAll('.tab').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.querySelectorAll('.section-title').forEach(title => {
                title.style.display = (cat === 'all' || cat === title.getAttribute('data-cat')) ? 'flex' : 'none';
            });
            document.querySelectorAll('.card').forEach(card => {
                card.style.display = (cat === 'all' || cat === card.getAttribute('data-cat')) ? 'flex' : 'none';
            });
        }

        function doLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if(u === 'Kaze Morales' && p === 'KazeMorales1') {
                userTier = 'DEVELOPER';
                document.getElementById('user-status').innerText = u;
                document.getElementById('user-tier').innerHTML = '<span class="role-badge" style="background:#00ff00;color:#000;font-weight:bold;">DEVELOPER</span>';
                document.getElementById('login-modal').style.display = 'none';
                document.querySelectorAll('.vip-lock').forEach(card => card.classList.remove('vip-lock'));
                alert('LOGIN BERHASIL! Akses DEV terbuka.');
            } else {
                alert('Login Gagal! Cek username/password.');
            }
        }

        function openTool(id) {
            if (document.querySelector(`.card[onclick="openTool('${id}')"]`).classList.contains('vip-lock')) {
                document.getElementById('vip-restrict').style.display = 'flex';
                return;
            }
            document.getElementById('tool-content').innerHTML = `
                <i class="fa-solid fa-xmark modal-close" onclick="document.getElementById('tool-modal').style.display='none'"></i>
                <h2>${id}</h2>
                <p style="color:#aaa; font-size:12px; margin-bottom:20px;">Fitur sedang dimuat dari server pusat...</p>
                <button onclick="document.getElementById('tool-modal').style.display='none'">TUTUP</button>
            `;
            document.getElementById('tool-modal').style.display = 'flex';
        }
    </script>
</body>
</html>
